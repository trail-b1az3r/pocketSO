# Pocketso live installer boot menu
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod exfat

if loadfont "${prefix}/fonts/unicode.pf2"; then
    insmod all_video
    set gfxmode="auto"
    terminal_output console
fi

set default=0
set timeout=10

menuentry "Pocketso Linux Installer (%ARCH%)" --id pocketso {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
