name: Build Pocketso ISO

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release version to tag and publish (for example v0.1.4). Leave blank for a build only."
        required: false
        type: string

concurrency:
  group: pocketso-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-iso:
    name: Build x86_64 installer and live ISOs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ISO in privileged Arch Linux container
        run: |
          mkdir -p out
          docker run --privileged --security-opt seccomp=unconfined --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed archiso shellcheck git grub python pyside6 qt6-declarative
              pacman-key --init
              pacman-key --populate archlinux
              bash -n build.sh
              ./build.sh --help
              python -m py_compile profile/airootfs/usr/share/pocketso/paket profile/airootfs/usr/share/pocketso/installer/app.py profile/airootfs/usr/share/pocketso/installer/backend.py scripts/check-installer-packages.py
              python profile/airootfs/usr/share/pocketso/paket --help >/dev/null
              python -m json.tool profile/airootfs/usr/share/pocketso/fastfetch/config.jsonc >/dev/null
              grep -qx 'arch' profile/airootfs/etc/pocketso/package-manager
              python scripts/check-installer-packages.py
              python scripts/check-installer-qml.py
              python -c "from PySide6.QtCore import QObject; from PySide6.QtQml import QQmlApplicationEngine"
              bash -n profile/airootfs/usr/local/bin/pocketso-installer
              bash -n profile/airootfs/root/customize_airootfs.sh
              bash -n profile/airootfs/usr/local/bin/pocketso-flasher
              bash -n profile/airootfs/usr/share/pocketso/disk-guard
              shellcheck -S warning profile/airootfs/root/customize_airootfs.sh profile/airootfs/usr/local/bin/pocketso-flasher profile/airootfs/usr/share/pocketso/disk-guard
              bash -n scripts/customize_live_airootfs.sh
              shellcheck -S warning scripts/customize_live_airootfs.sh
              ./build.sh --type all --manager arch --work /tmp/pocketso-work --out out
              test -n "$(find out -maxdepth 1 -type f -name '*installer*.iso' -print -quit)"
              test -n "$(find out -maxdepth 1 -type f -name '*live*.iso' -print -quit)"
            '

      - name: Upload installer and live ISOs
        uses: actions/upload-artifact@v4
        with:
          name: pocketso-installer-and-live-isos
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14


  build-native-flasher:
    name: Build native QML and C++ Linux flasher
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Qt 6 and C++ build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake ninja-build pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools \
            qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtqml-workerscript

      - name: Configure and compile native executables
        run: |
          cmake -S flasher -B build/flasher -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build/flasher --parallel 2
          DESTDIR="$GITHUB_WORKSPACE/package-root" cmake --install build/flasher
          test -x package-root/usr/bin/PocketsoFlasher
          test -x package-root/usr/libexec/pocketso-flash-root
          ldd package-root/usr/bin/PocketsoFlasher
          ldd package-root/usr/libexec/pocketso-flash-root

      - name: Smoke test QML application
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen timeout 8s package-root/usr/bin/PocketsoFlasher > flasher-smoke.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 124 ] && [ "$status" -ne 0 ]; then
            cat flasher-smoke.log
            exit "$status"
          fi
          cat flasher-smoke.log

      - name: Package Linux executables and desktop integration
        run: |
          tar -C package-root -czf PocketsoFlasher-linux-x86_64.tar.gz \
            usr/bin/PocketsoFlasher \
            usr/libexec/pocketso-flash-root \
            usr/share/applications/pocketso-flasher.desktop \
            usr/share/icons/hicolor/scalable/apps/pocketso-flasher.svg
          sha256sum PocketsoFlasher-linux-x86_64.tar.gz > PocketsoFlasher-linux-x86_64.tar.gz.sha256

      - name: Upload native Linux executable
        uses: actions/upload-artifact@v4
        with:
          name: pocketso-flasher-linux-x86_64
          path: |
            PocketsoFlasher-linux-x86_64.tar.gz
            PocketsoFlasher-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  create-release-tag:
    name: Create release tag
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: [build-iso, build-native-flasher]
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit to tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+[.][0-9]+[.][0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.1.4 or v0.1.4-rc1."
            exit 1
          fi

      - name: Create and push tag for this commit
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Tag ${RELEASE_TAG} already exists. Choose a new version."
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag "${RELEASE_TAG}" "${COMMIT_SHA}"
          git push origin "refs/tags/${RELEASE_TAG}"

  publish-release:
    name: Publish ISO and native Linux flasher release
    if: always() && needs.build-iso.result == 'success' && needs.build-native-flasher.result == 'success' && (needs.create-release-tag.result == 'success' || needs.create-release-tag.result == 'skipped') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != ''))
    needs: [build-iso, build-native-flasher, create-release-tag]
    runs-on: ubuntu-latest
    steps:
      - name: Download installer and live ISO artifacts
        uses: actions/download-artifact@v4
        with:
          name: pocketso-installer-and-live-isos
          path: release-assets/iso

      - name: Download native Linux flasher
        uses: actions/download-artifact@v4
        with:
          name: pocketso-flasher-linux-x86_64
          path: release-assets/flasher

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release-assets/iso/*.iso
            release-assets/iso/SHA256SUMS
            release-assets/flasher/*.tar.gz
            release-assets/flasher/*.sha256
          generate_release_notes: true
