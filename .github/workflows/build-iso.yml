name: Build Pocketso ISO

on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pocketso-iso-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-iso:
    name: Build x86_64 installer ISO
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build ISO in privileged Arch Linux container
        run: |
          mkdir -p out
          docker run --privileged --security-opt seccomp=unconfined --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              pacman -Syu --noconfirm
              pacman -S --noconfirm --needed archiso shellcheck git grub
              pacman-key --init
              pacman-key --populate archlinux
              python - <<'PY'
              import pathlib, re, shlex, subprocess, sys

              source = pathlib.Path("profile/airootfs/usr/local/bin/pocketso-flasher").read_text()
              base_match = re.search(r"^BASE_PKGS=\\(([^)]*)\\)", source, re.MULTILINE)
              if not base_match:
                  raise SystemExit("Could not extract BASE_PKGS from the USB flasher")
              packages = set(shlex.split(base_match.group(1)))
              desktop_matches = re.findall(
                  r"^\\s*(?:mate|kde|both)\\) DESKTOP_PKGS=\\(([^)]*)\\)",
                  source,
                  re.MULTILINE,
              )
              if len(desktop_matches) != 3:
                  raise SystemExit(f"Expected all three desktop package lists, found {len(desktop_matches)}")
              for group in desktop_matches:
                  packages.update(shlex.split(group))
              packages = sorted(packages)
              print(f"Validating {len(packages)} unique target-system packages")
              plan = subprocess.run(
                  ["pacman", "-Sp", "--print-format", "%n", "--noconfirm", *packages],
                  check=True, text=True, capture_output=True,
              )
              pathlib.Path("/tmp/pocketso-target-package-plan.txt").write_text(plan.stdout)
              print(f"Resolved target install plan: {len(plan.stdout.splitlines())} packages including dependencies")
              PY
              bash -n profile/airootfs/root/customize_airootfs.sh
              bash -n profile/airootfs/usr/local/bin/pocketso-flasher
              bash -n profile/airootfs/usr/share/pocketso/disk-guard
              shellcheck -S warning profile/airootfs/root/customize_airootfs.sh profile/airootfs/usr/local/bin/pocketso-flasher profile/airootfs/usr/share/pocketso/disk-guard
              mkarchiso -v -w /tmp/pocketso-work -o out profile
              cd out
              sha256sum *.iso > SHA256SUMS
            '

      - name: Upload installer ISO
        uses: actions/upload-artifact@v4
        with:
          name: pocketso-installer-iso
          path: |
            out/*.iso
            out/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS
          generate_release_notes: true
